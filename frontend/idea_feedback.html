<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Idea feedback | Feeny Power &amp; Control Ltd</title>
    <link rel="icon" href="/images/feeny-logo-512-circle-black-back.png" type="image/x-icon">
    <link rel="stylesheet" href="/styles/idea_feedback.css?v=20260925b">
</head>
<body>
    <main class="feedback-card">
        <p class="feedback-kicker">Morning idea</p>
        <h1 id="idea-title">This idea</h1>
        <p class="feedback-date" id="idea-date"></p>
        <form method="post" action="/idea-feedback/" id="feedback-form">
            <input type="hidden" name="b" id="field-b">
            <input type="hidden" name="d" id="field-d">
            <input type="hidden" name="t" id="field-t">
            <input type="hidden" name="s" id="field-s">
            <p class="feedback-label">Was this useful?</p>
            <div class="feedback-thumbs" role="radiogroup" aria-label="Was this useful?">
                <label class="thumb">
                    <input type="radio" name="v" value="up">
                    <span aria-hidden="true">👍</span>
                    <span class="thumb-text">Useful</span>
                </label>
                <label class="thumb">
                    <input type="radio" name="v" value="down">
                    <span aria-hidden="true">👎</span>
                    <span class="thumb-text">Not useful</span>
                </label>
            </div>
            <fieldset class="reasons" id="reasons-up">
                <legend>Thumbs up, pick one</legend>
                <label><input type="radio" name="reason" value="fits-how-i-work"> Fits how I actually work</label>
                <label><input type="radio" name="reason" value="new-angle"> A new angle I hadn't considered</label>
                <label><input type="radio" name="reason" value="specific-enough"> Specific enough to start</label>
                <label><input type="radio" name="reason" value="save-for-later"> Save for later</label>
            </fieldset>
            <fieldset class="reasons" id="reasons-down" hidden>
                <legend>Thumbs down, pick one</legend>
                <label><input type="radio" name="reason" value="not-how-i-work"> Not how I work</label>
                <label><input type="radio" name="reason" value="already-doing-this"> Already doing this, or too close to a recent one</label>
                <label><input type="radio" name="reason" value="wrong-focus"> Wrong focus for me right now</label>
                <label><input type="radio" name="reason" value="too-vague"> Too vague — I couldn't start it Monday</label>
                <label><input type="radio" name="reason" value="not-worth-payoff"> Fine idea, not worth the payoff</label>
                <label><input type="radio" name="reason" value="sparked"> Wrong, but it gave me an idea</label>
            </fieldset>
            <div id="topic-row">
                <label class="feedback-comment-label" for="field-c">Which topic was this?</label>
                <select name="c" id="field-c" required>
                    <option value="">Pick the topic</option>
                    <option>Marketing / Landing Page SEO</option>
                    <option>Marketing / Social Media Content</option>
                    <option>Sales / Email Outreach</option>
                    <option>Sales / Proposals</option>
                    <option>Sales / Offer &amp; Packaging</option>
                    <option>CRM / Client Feedback</option>
                    <option>CRM / Client Qualification</option>
                    <option>CRM / Retention &amp; Expansion</option>
                    <option>Operations / Delivery Playbooks</option>
                    <option>Operations / Admin Automation</option>
                    <option>Operations / Unpaid-Work Prevention</option>
                    <option>Operations / Invoice &amp; Collections</option>
                </select>
            </div>
            <div id="note-row" hidden>
                <label class="feedback-comment-label" for="note">Note</label>
                <textarea id="note" name="note" maxlength="2000" rows="4"></textarea>
            </div>
            <button type="submit">Confirm</button>
        </form>
    </main>
    <script src="/scripts/idea_feedback.js?v=20260925b"></script>
</body>
</html>
