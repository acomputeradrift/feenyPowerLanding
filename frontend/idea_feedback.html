<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Idea feedback | Feeny Power &amp; Control Ltd</title>
    <link rel="icon" href="/images/feeny-logo-512-circle-black-back.png" type="image/x-icon">
    <link rel="stylesheet" href="/styles/idea_feedback.css?v=20260925">
</head>
<body>
    <main class="feedback-card">
        <p class="feedback-kicker">Morning idea</p>
        <h1 id="idea-title">This idea</h1>
        <p class="feedback-date" id="idea-date"></p>
        <form method="post" action="/idea-feedback/" id="feedback-form">
            <input type="hidden" name="b" id="field-b">
            <input type="hidden" name="d" id="field-d">
            <input type="hidden" name="t" id="field-t">
            <input type="hidden" name="s" id="field-s">
            <p class="feedback-label">Was this useful?</p>
            <div class="feedback-thumbs" role="radiogroup" aria-label="Was this useful?">
                <label class="thumb">
                    <input type="radio" name="v" value="up">
                    <span aria-hidden="true">👍</span>
                    <span class="thumb-text">Useful</span>
                </label>
                <label class="thumb">
                    <input type="radio" name="v" value="down">
                    <span aria-hidden="true">👎</span>
                    <span class="thumb-text">Not useful</span>
                </label>
            </div>
            <fieldset class="reasons" id="reasons-up">
                <legend>Why it was useful</legend>
                <label><input type="radio" name="reason" value="fits-how-i-work"> Fits how I work</label>
                <label><input type="radio" name="reason" value="new-angle"> New angle</label>
                <label><input type="radio" name="reason" value="specific-enough"> Specific enough</label>
            </fieldset>
            <fieldset class="reasons" id="reasons-down" hidden>
                <legend>Why it was not useful</legend>
                <label><input type="radio" name="reason" value="not-how-i-work"> Not how I work</label>
                <label><input type="radio" name="reason" value="already-doing-this"> Already doing this</label>
                <label><input type="radio" name="reason" value="wrong-focus"> Wrong focus</label>
                <label><input type="radio" name="reason" value="too-vague"> Too vague</label>
                <label><input type="radio" name="reason" value="not-worth-payoff"> Not worth the payoff</label>
                <label><input type="radio" name="reason" value="sparked"> This sparked a different idea</label>
            </fieldset>
            <div id="topic-row">
                <label class="feedback-comment-label" for="field-c">Which topic was this?</label>
                <select name="c" id="field-c" required>
                    <option value="">Pick the topic</option>
                    <option>Marketing / Landing Page SEO</option>
                    <option>Marketing / Social Media Content</option>
                    <option>Sales / Email Outreach</option>
                    <option>Sales / Proposals</option>
                    <option>Sales / Offer &amp; Packaging</option>
                    <option>CRM / Client Feedback</option>
                    <option>CRM / Client Qualification</option>
                    <option>CRM / Retention &amp; Expansion</option>
                    <option>Operations / Delivery Playbooks</option>
                    <option>Operations / Admin Automation</option>
                    <option>Operations / Unpaid-Work Prevention</option>
                    <option>Operations / Invoice &amp; Collections</option>
                </select>
            </div>
            <label class="feedback-comment-label" for="note">Note <span>(optional)</span></label>
            <textarea id="note" name="note" maxlength="2000" rows="4" placeholder="What to keep, or what this sparked."></textarea>
            <div class="feedback-actions">
                <button type="submit" name="action" value="vote">Confirm</button>
                <button type="submit" name="action" value="saved" class="secondary">Save for later</button>
                <button type="submit" name="action" value="done" class="secondary">I did this</button>
            </div>
        </form>
    </main>
    <script src="/scripts/idea_feedback.js?v=20260925"></script>
</body>
</html>
